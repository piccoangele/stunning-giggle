<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My running plan</title>
<style>
:root{--bg:#fff6ec;--bg2:#ffe6c8;--fg:#3b2a35;--mut:#7a6272;--card:#fffdf9;--ln:#f0dfcc;--ac:#f2a541;--acfg:#3b2a35;--soft:#ffe9cf;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{overflow-anchor:none;scroll-behavior:auto;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);background:var(--bg) linear-gradient(180deg,var(--bg2) 0,var(--bg) 280px) no-repeat;font:16px/1.5 ui-rounded,"SF Pro Rounded","Nunito","Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
.hero{padding:8px 4px 4px}
h1{font-size:31px;line-height:1.15;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0 0 14px;color:var(--mut)}
#prog{font-size:14px;font-weight:700}
.bar{height:10px;margin-top:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ac)}
h2{font-size:21px;margin:22px 0 2px;font-weight:800}
.m{color:var(--mut);font-size:14px}
details{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin-top:14px}
summary{font-weight:800;cursor:pointer}
label{display:block;margin:14px 0 0;font-size:14px;color:var(--mut);font-weight:600}
select,input{width:100%;margin-top:5px;padding:11px 12px;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--ln);border-radius:12px}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;gap:7px;margin:10px 0;flex-wrap:wrap}
.wk{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
.chips button{flex:0 0 auto;min-width:46px;padding:10px 12px;font:inherit;font-weight:700;color:var(--fg);background:var(--card);border:1.5px solid var(--ln);border-radius:99px}
.chips button.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.btn{width:100%;margin-top:16px;padding:14px;font:inherit;font-weight:800;color:var(--acfg);background:var(--ac);border:0;border-radius:99px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin-top:14px;font-size:15px}
.wo{background:var(--card);border:1px solid var(--ln);border-left:7px solid var(--t);border-radius:16px;padding:12px 14px;margin-top:10px}
.wo b{display:block;font-size:17px;font-weight:800}
.wo.done{background:var(--soft)}.wo.done b::after{content:" \2713";color:var(--t)}
.rest{color:var(--mut);font-size:14px;padding:9px 6px}
.easy{--t:#6f9e80}.tempo{--t:#e49a26}.int{--t:#e5705a}.long{--t:#7c86c8}.race{--t:#a8628f}
.note{margin-top:24px;font-size:13px;color:var(--mut)}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.chips button.past{opacity:.5}.chips button.now{box-shadow:0 0 0 2px var(--ac)}
.past .wo{opacity:.55}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.btn.sm{margin-top:10px;padding:10px 14px;font-size:15px}

.row>*{min-width:0}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main>
<header class="hero"><h1>My running plan</h1><p>Steady, gentle, at your own pace.</p><div class="m" id="today"></div><div id="prog"></div></header>
<details id="setup" open><summary>Your setup</summary>
<label>Objective<select id="obj">
<option value="goal">Work toward a goal time</option>
<option value="5k">Event: 5K</option><option value="10k">Event: 10K</option><option value="half">Event: half marathon</option><option value="marathon">Event: marathon</option>
<option value="faster">Get faster</option><option value="base">Build a base</option><option value="return">Return to running</option><option value="consistent">Run consistently</option></select></label>
<div class="row"><label>Current result: distance<select id="dist"><option value="5">5 km</option><option value="10">10 km</option><option value="21.1">Half marathon</option><option value="42.2">Marathon</option></select></label>
<label>Time<input id="time" placeholder="40:00 or 1:55:00"></label></div>
<div class="row"><label>Goal time (goal mode)<input id="tgt" placeholder="30:00"></label>
<label>Weeks (optional)<input id="wks" type="number" min="4" max="52" inputmode="numeric"></label></div>
<label>Event date (optional, event modes)<input type="date" id="rd"></label>
<label>Current running per week (km)<input id="km" type="number" min="0" max="150" inputmode="decimal"></label>
<label>Start date<input type="date" id="sdt"></label>
<div class="chips" id="sq"><button type="button" data-sd="0">Today</button><button type="button" data-sd="1">Tomorrow</button><button type="button" data-sd="m">Next Monday</button></div>
<label>Usual run time (for your calendar)<input type="time" id="rtm" value="07:00"></label>
<label>Days you can run</label><div id="dys" class="chips"></div>
<button id="go" class="btn" type="button">Preview my plan</button><div id="setup-msg" role="alert"></div></details>
<div id="out"></div>
<p class="note">Missing a run is fine, the plan adjusts. Stop and rest if something hurts. These are guidelines, not medical advice, and your data stays on this device.</p>
</main>
<script>
const $=s=>document.querySelector(s);
const G=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const S=(k,v)=>{if(draft&&k!='runs')return;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){msg='Your browser could not save changes. Keep this page open; changes may be lost on reload.'}};
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const RACE={'5k':5,'10k':10,half:21.1,marathon:42.2},DK={'5':'5k','10':'10k','21.1':'half','42.2':'marathon'};
const NAME={'5k':'5K','10k':'10K',half:'Half marathon',marathon:'Marathon'};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const iso=d=>d.toLocaleDateString('sv-SE');
const fd=d=>d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const mon=()=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+(8-d.getDay())%7);return d};
const nextMon=()=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+((8-d.getDay())%7||7));return d};
const mins=t=>{const s=String(t||'').trim();if(!/^\d+(?::[0-5]\d){0,2}$/.test(s))return 0;const p=s.split(':').map(Number),v=p.length==3?p[0]*60+p[1]+p[2]/60:p[0]+(p[1]||0)/60;return Number.isFinite(v)?v:0};
const dayNumber=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&Number.isFinite(dayNumber(s))&&iso(new Date(s+'T12:00'))===s;
const vdot=(m,t)=>{const v=m/t;return(-4.6+.182258*v+.000104*v*v)/(.8+.1894393*Math.exp(-.012778*t)+.2989558*Math.exp(-.1932605*t))};
const pace=(vd,f)=>{const o=f*vd;return 1000/((-.182258+Math.sqrt(.182258**2+4*.000104*(4.6+o)))/(2*.000104))};
const fp=x=>{let m=Math.floor(x),s=Math.round((x-m)*60);if(s==60){m++;s=0}return m+':'+String(s).padStart(2,'0')};
const ft=t=>{const s=Math.round(t*60),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')};
const rate=v=>v<30?.012:v<40?.008:v<50?.005:.003;
const proj=(v,n)=>{for(let i=0;i<n;i++)v*=1+rate(v);return v};
const timeFor=(vd,km)=>{let lo=5,hi=700;for(let i=0;i<40;i++){const m=(lo+hi)/2;vdot(km*1000,m)>vd?lo=m:hi=m}return(lo+hi)/2};

let draft=false,chosen=G('chosen',false),pend=0,c,res,rt,done,started,wo={},er=null,dr=null,ro=false,runs=G('runs',[]),cur=null,plan=null,act={},msg='';
const DEF={obj:'goal',rd:'',dist:'5',time:'',tgt:'',wks:'',km:20,days:[1,3,6],start:'',begin:'',rtm:'07:00'};
function load(){c={...DEF,...G('cfg',DEF)};res=G('res',[]);done=G('done',{});rt=G('rt',{});started=G('started',[]);wo=G('wo',{})}
load();let sd=[...c.days];
const weekOf=d=>Math.floor((dayNumber(d)-dayNumber(c.start))/7);
const vdAt=w=>{let r=null;for(const x of res)if(x.w<=w&&(!r||x.w>=r.w))r=x;return r?(c.obj=='goal'?proj(r.v,w-r.w):r.v):0};

function build(){
 const goal=c.obj=='goal',eo=goal?DK[c.dist]:c.obj,race=eo in RACE,st=new Date(c.start+'T12:00');
 let W={'5k':10,'10k':12,half:14,marathon:18}[eo]||8,rd=null,note='';
 if(!goal&&+c.wks>0)W=+c.wks;
 if(race&&!goal&&c.rd){const r=new Date(c.rd+'T12:00'),wk=Math.floor((dayNumber(c.rd)-dayNumber(c.start))/7)+1;if(r>=st&&wk<=52){rd=r;W=wk}}
 if(goal){
  const lr=res.reduce((a,x)=>x.w>=a.w?x:a,{w:0,v:0}),vT=vdot(c.dist*1000,mins(c.tgt));let n=0,v=lr.v;
  while(v<vT&&n<52){v*=1+rate(v);n++}
  const need=Math.max(6,lr.w+n);W=Math.max(lr.w+1,started.length?Math.max(...started)+1:1,+c.wks>0?+c.wks:need);
  note=+c.wks>0?`In ${W} weeks, this simplified projection suggests about ${ft(timeFor(proj(lr.v,W-lr.w),c.dist))}. The same projection suggests about ${need} weeks.`
   :`Rough projection: ${need} weeks. This is a planning estimate, not a prediction of fitness gains. Recent results update your paces and timeline.`;
  if(n>=52)note+=' That is over a year: consider an intermediate goal first.';
 }
 const T=race?(eo=='5k'||eo=='10k'?1:2):0,B=W-T;
 let s0=+c.km;if(eo=='return')s0=Math.min(s0,10);
 const cap={'5k':45,'10k':55,half:70,marathon:90}[eo]||60;
 const peak=Math.max(s0,Math.min(cap,s0*(eo=='consistent'?1.15:eo=='return'?2:1.5)));
 const lc={'5k':14,'10k':18,half:24,marathon:32}[eo]||16;
 const wd=[...c.days].sort((a,b)=>a-b);


 const bg=new Date((c.begin||c.start)+'T12:00'),dflt=w=>w==0?c.days.filter(d=>add(st,d)>=bg):c.days;
 let base=s0;const weeks=[];
 for(let w=0;w<W;w++){
  const tp=w>=B,rec=!tp&&w%4==3,last=w==W-1;let km,ease=false,adj='';
  const b0=base;
  if(!tp&&!rec&&w>0)base=Math.min(peak,base*1.08);
  const pw=weeks[w-1];
  if(pw&&pw.fewer){base=Math.min(base,b0);adj='Last week had fewer runs, so this week holds steady instead of building.'}
  if(pw&&started.includes(w-1)){
   const its=Object.keys(pw.items),dn=its.filter(d=>done[(w-1)+'-'+d]),ck=dn.reduce((a,d)=>a+pw.items[d].km,0);
   const tot=its.reduce((a,d)=>a+pw.items[d].km,0)||1,got=act[w-1]!=null?act[w-1]:ck,ratio=got/tot;
   const rs=dn.map(d=>rt[(w-1)+'-'+d]||'fine'),hd=rs.filter(x=>x=='hard').length,es=rs.filter(x=>x=='easy').length;
   if(ratio<.5){base=b0*.85;ease=true;adj='Last week had few runs, so this week steps back a little.'}
   else if(ratio<.85){base=Math.min(base,b0);adj='You did most of last week, so this week holds steady instead of building.'}
   else if(rs.length&&hd/rs.length>=.5){base=b0*.9;ease=true;adj='Several runs felt hard, so this week is lighter with no hard sessions.'}
   else if(rs.length&&es/rs.length>=.66){base=Math.min(peak,base*1.03);adj='Last week felt easy, so this week builds a touch more.'}
   else if(!pw.fewer)adj='Last week went well, so steady progress continues.'}
  km=tp?base*(last?.55:.75):rec?base*.8:base;
  const dw=[...(wo[w]&&wo[w].length?wo[w]:dflt(w))].sort((a,b)=>a-b),nr=dw.length,fewer=nr<c.days.length,kmFull=km;
  if(fewer)km*=.5+.5*nr/c.days.length;
  const vd=vdAt(w),ep=vd?pace(vd,.7):6.5,tpc=vd?pace(vd,.88):5.5,ip=vd?pace(vd,.98):5.1;
  const P=vd?{e:fp(pace(vd,.74))+'–'+fp(pace(vd,.65)),t:fp(tpc),i:fp(ip),v:vd}:null;
  const ph=tp?'Taper':rec?'Recovery':w<B*.4?'Base':w<B*.8?'Build':'Peak';
  const rdx=last&&race?(rd?(rd.getDay()+6)%7:(dw[dw.length-1]??6)):-1;
  const sel=rdx>=0?dw.filter(d=>d<rdx):dw,n=sel.length,items={};
  const ld=sel.filter(d=>d>4).pop()??sel[n-1];
  if(rdx>=0){
   items[rdx]={t:'race',title:goal?`Goal day: ${NAME[eo]} in ${c.tgt}`:'Event day: '+NAME[eo],desc:goal?`Aim for around ${fp(mins(c.tgt)/c.dist)}/km and enjoy the final kilometre.`:'Start easy, run by feel, enjoy the finish.',km:RACE[eo]};
   sel.forEach((d,i)=>items[d]={t:'easy',title:'Easy shake-out',desc:'20–30 min easy'+(i==n-1?', plus 4 × 20 s strides':''),km:4});
  }else if(eo=='return'){
   const r=[1,2,3,4,5,8,10,15][Math.min(w,7)],k=w<6?2:1,reps=Math.max(1,Math.round((30+(w>3?5:0))/(r+k)));
   sel.forEach(d=>items[d]={t:d==ld?'long':'easy',title:`${reps} × (${r} min run, ${k} min walk)`,desc:'Very easy, you can talk. Stop if something hurts.',km:+(reps*(r+k)/8).toFixed(1)});
  }else if(n){
   let qn=ease||['consistent','base'].includes(eo)?0:tp?1:rec?0:ph=='Base'?1:n>3?2:1;qn=Math.max(0,Math.min(qn,n-2));
   const fr=m=>m==1?1:m==2?.5:m==3?.4:.3,nl=Math.min(kmFull*fr(c.days.length),lc),lk=Math.max(3,Math.round(Math.min(km*fr(n),lc,fewer?nl*1.35:lc)));
   items[ld]={t:'long',title:`Long run ${lk} km`,desc:'Easy, steady effort'+(P?`, ${P.e}/km`:''),km:lk};
   const rem=sel.filter(d=>d!=ld),hard=[ld],qd=[],md=d=>Math.min(...hard.map(x=>Math.abs(x-d)));
   for(let i=0;i<qn;i++){const cd=rem.filter(d=>!hard.includes(d)).sort((a,b)=>md(b)-md(a));if(!cd.length)break;qd.push(cd[0]);hard.push(cd[0])}
   const kinds=ph=='Build'?['tempo','int']:ph=='Peak'?['int','tempo']:['tempo'];
   qd.forEach((d,i)=>{
    if(kinds[i]=='tempo'){const m=tp?10:Math.min(30,10+2*w);items[d]={t:'tempo',title:`Tempo ${m} min`,desc:`2 km easy, ${m} min at ${P?P.t+'/km':'comfortably hard'}, 2 km easy`,km:+(4+m/tpc).toFixed(1)}}
    else{const r=Math.min(8,3+(w>>1));items[d]={t:'int',title:`${r} × 3 min intervals`,desc:`2 km easy, ${r} × 3 min at ${P?P.i+'/km':'hard but controlled'} with 2 min jog, 2 km easy`,km:+(4+r*(3/ip+2/ep)).toFixed(1)}}});
   const used=Object.values(items).reduce((s,x)=>s+x.km,0),ez=sel.filter(d=>!items[d]);
   ez.forEach((d,i)=>{const k=Math.max(3,Math.min(Math.round((km-used)/ez.length),Math.round(lk*.8)));
    items[d]={t:'easy',title:'Easy run',desc:`${k} km, conversational`+(P?`, ${P.e}/km`:'')+(i==0?', plus 6 × 20 s strides':''),km:k}});
   if(goal&&rec&&ez.length){const td=c.dist<=10?+c.dist:5;
    items[ez[0]]={t:'int',title:`Check-in: ${td} km at a strong, even effort`,desc:`15 min easy warm-up, then ${td} km at a strong effort you can keep steady. Log the time under Update my paces with a recent result so the plan fits you. Around ${ft(timeFor(vd,td))} is a fair guess, and any time is useful.`,km:td+3}}
  }
  weeks.push({ph,items,P,adj,fewer,date:add(st,7*w),km:Math.round(Object.values(items).reduce((s,x)=>s+x.km,0))});
 }
 const lw=weeks[W-1],rk=Object.keys(lw.items).find(d=>lw.items[d].t=='race');
 return{weeks,note,fin:rk!=null?add(lw.date,+rk):add(lw.date,6),finRace:rk!=null,begin:bg};
}

const csv=t=>{const r=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(f);f=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(f);r.push(row);row=[];f=''}else f+=ch}if(f||row.length){row.push(f);r.push(row)}return r};
function pCsv(t){const r=csv(t),h=r.shift()||[],iD=h.indexOf('Activity Date'),iT=h.indexOf('Activity Type'),iM=h.lastIndexOf('Moving Time'),ds=h.map((x,i)=>x=='Distance'?i:-1).filter(i=>i>=0),o=[];
 for(const x of r){if(!/run/i.test(x[iT]||''))continue;const dt=new Date(String(x[iD]).replace(/,(\s*\d{1,2}:)/,' $1'));if(isNaN(dt))continue;
  let km=Math.max(0,...ds.map(i=>parseFloat(String(x[i]).replace(',','.'))||0));if(km>300)km/=1000;o.push({d:iso(dt),km,min:(parseFloat(x[iM])||0)/60})}return o}
const hav=(a,b)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(b[0]-a[0])/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(r(b[1]-a[1])/2)**2;return 12742*Math.asin(Math.sqrt(h))};
function pGpx(t){const d=new DOMParser().parseFromString(t,'text/xml'),pts=[...d.getElementsByTagName('trkpt')];let km=0,pr=null,t0=null,t1=null;
 for(const p of pts){const q=[+p.getAttribute('lat'),+p.getAttribute('lon')];if(pr)km+=hav(pr,q);pr=q;const e=p.getElementsByTagName('time')[0];if(e){const z=new Date(e.textContent);t0=t0||z;t1=z}}
 return t0&&t1?[{d:iso(t0),km,min:(t1-t0)/6e4}]:[]}
function pTcx(t){const d=new DOMParser().parseFromString(t,'text/xml'),o=[];
 for(const a of d.getElementsByTagName('Activity')){if((a.getAttribute('Sport')||'').toLowerCase()!='running')continue;let km=0,s=0;
  for(const l of a.getElementsByTagName('Lap')){km+=+(l.getElementsByTagName('DistanceMeters')[0]?.textContent||0)/1000;s+=+(l.getElementsByTagName('TotalTimeSeconds')[0]?.textContent||0)}
  const id=a.getElementsByTagName('Id')[0]?.textContent;if(id)o.push({d:iso(new Date(id)),km,min:s/60})}return o}

function chips(){$('#dys').innerHTML=DAYS.map((d,i)=>`<button type="button" data-i="${i}" class="${sd.includes(i)?'on':''}">${d}</button>`).join('')}
const fdy=d=>d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const tdy=()=>{$('#today').textContent='Today: '+fdy(new Date())};
const last=()=>started.length?Math.max(...started):-1;
const stat=w=>{const x=plan.weeks[w],ks=Object.keys(x.items),dn=ks.filter(d=>done[w+'-'+d]);return{n:ks.length,dn:dn.length,rated:dn.filter(d=>rt[w+'-'+d]).length}};
const esc=t=>String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function ics(ws){
 const p=n=>String(n).padStart(2,'0'),f=(d,h,m)=>`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(h)}${p(m)}00`;
 const [h,m]=(c.rtm||'07:00').split(':').map(Number),now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',td=iso(new Date()),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//My running plan//EN'];let n=0;
 for(const [w,x] of ws)for(const d in x.items){const dt=add(x.date,+d);if(iso(dt)<td||done[w+'-'+d])continue;
  const it=x.items[d],s=new Date(dt);s.setHours(h,m,0,0);const e=new Date(s.getTime()+Math.max(25,Math.round(it.km*7))*6e4);n++;
  L.push('BEGIN:VEVENT',`UID:w${w}d${d}-${c.start}@runplan`,'DTSTAMP:'+now,'DTSTART:'+f(s,h,m),'DTEND:'+f(e,e.getHours(),e.getMinutes()),'SUMMARY:'+esc('Run: '+it.title),'DESCRIPTION:'+esc(it.desc+' ('+it.km+' km)'),'BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:Run','END:VALARM','END:VEVENT')}
 L.push('END:VCALENDAR');return n?L.join('\r\n'):''}
async function send(ws,name){
 const t=ics(ws);if(!t){msg='Nothing to add: no upcoming runs left.';render();return}
 const f=new File([t],name,{type:'text/calendar'});

function week(){
 const x=plan.weeks[cur],P=x.P,L=last(),on=chosen&&!draft,live=on&&cur==L,past=on&&cur<L,nxt=on&&cur==L+1;
 let h=`<div class="${past?'past':''}"><h2 data-view-key="week-heading">Week ${cur+1}: ${x.ph}, ${x.km} km</h2><div class="m">${fd(x.date)} to ${fd(add(x.date,6))}${act[cur]!=null?`. Logged runs: ${act[cur].toFixed(1)} km`:''}</div>`;
 if(P)h+=`<div class="m">Paces this week: easy ${P.e}/km, tempo ${P.t}/km, intervals ${P.i}/km</div>`;
 if(cur==0&&plan.begin>x.date)h+=`<div class="card">You start on ${fdy(plan.begin)}, so this week only has the remaining run days. Next week is a full week.</div>`;
 if(x.adj&&(live||past||nxt))h+=`<div class="card">${x.adj}${nxt?' This preview updates as you log your runs.':''}</div>`;

  h+=pend==cur?`<div class="card">Week ${cur} has ${u} runs not marked done and ${v} done runs without a rating. Unmarked runs count as skipped, unrated runs as fine.<div class="row"><button type="button" class="btn sm" data-go="${cur}">Start week ${cur+1}</button><button type="button" class="btn sm alt" data-no="1">Go back</button></div></div>`
  :`<button type="button" class="btn" data-start="${cur}">Start week ${cur+1}</button>`}
 else if(on&&cur>L+1)h+=`<div class="m">Preview. This week updates as you finish earlier weeks.</div>`;
 if(on&&cur>=L){const a0=(wo[cur]&&wo[cur].length)?wo[cur]:(cur==0?c.days.filter(d=>add(x.date,d)>=plan.begin):c.days);
  h+=`<div class="card">Run days this week: ${a0.length}. ${Object.keys(done).some(k=>k.startsWith(cur+'-')&&done[k])?'This schedule is locked because you have completed a run. You can adjust future weeks.':'Changing days rebuilds this week.'}<div class="chips">${DAYS.map((nm,d)=>`<button type="button" ${(cur==0&&add(x.date,d)<plan.begin)||Object.keys(done).some(k=>k.startsWith(cur+'-')&&done[k])?'disabled':''} class="${a0.includes(d)?'on':''}" data-wd="${d}">${nm}</button>`).join('')}</div>${wo[cur]?'<button type="button" class="btn sm alt" data-wr="1">Back to my usual days</button>':''}</div>`}
 for(let d=0;d<7;d++){const it=x.items[d],dt=add(x.date,d);
  if(!it){h+=`<div class="rest" data-view-key="day-${d}">${fd(dt)}, rest day</div>`;continue}
  const k=cur+'-'+d,dn=done[k],r=rt[k];let ctl='';

// Replacing #out used to collapse the page and discard focus, open sections and edits.
// Hold the document height until the rebuilt content and viewport have been restored.
function render(){
 const out=$('#out'), y=window.scrollY, x=window.scrollX;
 const minHeight=document.body.style.minHeight;
 const sections=[...out.querySelectorAll('details[id]')].map(e=>[e.id,e.open]);
 const fields=[...out.querySelectorAll('input[id]:not([type="file"]),select[id]')].map(e=>[e.id,e.value]);
 const focused=out.contains(document.activeElement)?document.activeElement:null;
 const focusKey=focused?(focused.id?'#'+focused.id:[...focused.attributes].filter(a=>a.name.startsWith('data-')).map(a=>'['+a.name+'="'+CSS.escape(a.value)+'"]').join('')):'';
 const anchor=[...out.querySelectorAll('[data-view-key]')].find(e=>{const r=e.getBoundingClientRect();return r.bottom>0&&r.top<window.innerHeight});
 const anchorKey=anchor?.dataset.viewKey, top=anchor?.getBoundingClientRect().top;
 document.body.style.minHeight=document.documentElement.scrollHeight+'px';
 try {
  renderContent();
  for(const [id,open] of sections){const e=document.getElementById(id);if(e)e.open=open}
  for(const [id,value] of fields){const e=document.getElementById(id);if(e)e.value=value}
  if(focusKey){const e=out.querySelector(focusKey);if(e)e.focus({preventScroll:true})}
  const next=anchorKey?out.querySelector('[data-view-key="'+CSS.escape(anchorKey)+'"]'):null;
  const target=next?window.scrollY+next.getBoundingClientRect().top-top:y;
  document.body.style.minHeight=minHeight;
  window.scrollTo({left:x,top:target,behavior:'instant'});
 } finally {document.body.style.minHeight=minHeight}
}
function renderContent(){

 if(on&&L>=0&&L+1<W){const s=stat(L),ready=s.n&&s.dn==s.n&&s.rated==s.n;if(ready||cw>L)ban=`<div class="card">${ready?`All runs of week ${L+1} are logged and rated.`:'A new week has begun.'}<button type="button" class="btn sm" data-start="${L+1}">Start week ${L+2}</button></div>`}

 +dc+ban+(plan.note?`<div class="card">${plan.note}</div>`:'')

 +`<div class="chips wk" data-view-key="week-picker" aria-label="Plan weeks">${plan.weeks.map((x,i)=>`<button type="button" data-w="${i}" aria-pressed="${i==cur}" class="${i==cur?'on':''}${on&&i<L?' past':''}${on&&i==L?' now':''}">W${i+1}</button>`).join('')}</div><div id="wkv"></div>`;

$('#dys').onclick=e=>{let i=e.target.dataset.i;if(i==null)return;i=+i;sd=sd.includes(i)?sd.filter(x=>x!=i):[...sd,i];chips()};

const bd=$('#sdt').value||iso(nextMon()),bdd=new Date(bd+'T12:00');

 const vd=mins(n.time)>0?vdot(n.dist*1000,mins(n.time)):0;let err='';

$('#out').onclick=e=>{
